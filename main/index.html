<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Gemini 3.1 Pro and 3.5 Flash -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ UI Framework</title>
    <style>
        /* Basic styling to make the elements visible */
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        #app-root {
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 50px;
        }

        button {
            cursor: pointer;
            padding: 5px 10px;
        }

        .vertical_layout {
            display: grid;
            grid-template-rows: auto;
        }

        .grid_layout {
            display: grid;
            gap: 10px;
            grid-template-rows: auto;
            grid-template-columns: auto;
        }
    </style>
</head>

<body>

    <!-- This is the container where your C++ UI will be injected -->
    <div id="app-root">Loading UI...</div>

    <script>
        const INIT_ENDPOINT = '/ui/init';
        const EVENT_ENDPOINT = '/ui/event';

        // State management to prevent network race conditions
        let isPending = false;

        async function initializeUI() {
            try {
                const response = await fetch(INIT_ENDPOINT);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const componentTree = await response.json();
                updateAppRoot(componentTree);
            } catch (error) {
                handleGlobalError("Failed to initialize UI", error);
            }
        }

        function updateAppRoot(componentTree) {
            const appRoot = document.getElementById('app-root');
            appRoot.innerHTML = '';

            const domTree = createDOMElement(componentTree);
            appRoot.appendChild(domTree);
        }

        function createDOMElement(node) {
            const element = document.createElement(node.tag);

            if (node.id) element.id = node.id;

            // Apply attributes (classes, styles, etc.) if provided by backend
            if (node.attributes && Array.isArray(node.attributes) && node.attributes.length > 0) {
                node.attributes.forEach(a => element.setAttribute(a.key, a.value));
            }

            // custom ohdeer properties
            if (node.properties && Array.isArray(node.properties)) {
                node.properties.forEach(p => {
                    if(p.key === "textContent") {
                        element.appendChild(document.createTextNode(p.value));
                    }
                });
            }

            // Bind events safely
            if (Array.isArray(node.events)) {
                node.events.forEach(eventType => {
                    element.addEventListener(eventType, () => handleUIEvent(eventType, node.id));
                });
            }

            // Process children
            if (Array.isArray(node.children)) {
                node.children.forEach(childNode => {
                    element.appendChild(createDOMElement(childNode));
                });
            }

            return element;
        }

        async function handleUIEvent(eventType, targetId) {
            if (isPending) return; // Drop events if a UI update is already in progress
            isPending = true;

            try {
                const response = await fetch(EVENT_ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ event: eventType, target: targetId, payload: {} })
                });

                if (!response.ok) throw new Error(`Server returned status: ${response.status}`);

                const newComponentTree = await response.json();
                updateAppRoot(newComponentTree);
            } catch (error) {
                console.error(`Event execution failed [${eventType} on ${targetId}]:`, error);
            } finally {
                isPending = false;
            }
        }

        function handleGlobalError(message, error) {
            console.error(message, error);
            document.getElementById('app-root').textContent = "A critical communication error occurred.";
        }

        window.addEventListener('DOMContentLoaded', initializeUI);
    </script>
</body>

</html>
